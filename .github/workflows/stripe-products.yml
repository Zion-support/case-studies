name: Zion Stripe Products Setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stripe-setup:
    runs-on: ubuntu-latest
    env:
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      ZION_USER_ID: ${{ secrets.ZION_USER_ID }}
      COMPOSIO_STRIPE_CONNECTION_ID: ${{ secrets.COMPOSIO_STRIPE_CONNECTION_ID }}
      COMPOSIO_RESEND_CONNECTION_ID: ${{ secrets.COMPOSIO_RESEND_CONNECTION_ID }}
      COMPOSIO_SLACK_CONNECTION_ID: ${{ secrets.COMPOSIO_SLACK_CONNECTION_ID }}
      SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Composio SDK
        continue-on-error: true
        run: npm install @composio/core
      - name: Create Stripe Products & Prices
        continue-on-error: true
        run: node .github/scripts/composio/monetization/stripe-products.mjs

      - name: Summary
        if: always()
        run: |
          echo "### Composio Stripe Products Setup" >> $GITHUB_STEP_SUMMARY
          echo "Workflow completed." >> $GITHUB_STEP_SUMMARY
