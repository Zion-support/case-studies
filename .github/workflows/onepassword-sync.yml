name: composio-1password-sync

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  onepassword-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Guard — require Composio secrets
        id: guard
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_1PASSWORD_CONNECTION_ID: ${{ secrets.COMPOSIO_1PASSWORD_CONNECTION_ID }}
        run: |
          if [ -z "$COMPOSIO_API_KEY" ] || [ -z "$COMPOSIO_1PASSWORD_CONNECTION_ID" ]; then
            echo "::warning::COMPOSIO_API_KEY or COMPOSIO_1PASSWORD_CONNECTION_ID not set — skipping 1Password sync (no-op)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.guard.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Composio SDK
        if: steps.guard.outputs.skip == 'false'
        run: npm install @composio/core

      - name: Refresh 1Password connection
        if: steps.guard.outputs.skip == 'false'
        id: onepassword
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_1PASSWORD_CONNECTION_ID: ${{ secrets.COMPOSIO_1PASSWORD_CONNECTION_ID }}
        run: |
          cat > sync.mjs <<'EOF'
          import { Composio } from '@composio/core';
          const composio = new Composio({ apiKey: process.env.COMPOSIO_API_KEY });
          const client = composio.getClient();
          const connectionId = process.env.COMPOSIO_1PASSWORD_CONNECTION_ID;
          const result = await client.tools.execute('_1PASSWORD_LIST_ITEMS', {
            connection_id: connectionId,
            entity_id: 'pg-test-b311dcc6-03f6-4077-8774-c90cfd6fcf29',
            arguments: {}
          });
          console.log(JSON.stringify(result, null, 2));
          EOF
          node sync.mjs

      - name: Comment summary
        if: always()
        env:
          SKIP: ${{ steps.guard.outputs.skip }}
        run: |
          if [ "$SKIP" = "true" ]; then
            echo "1Password sync skipped — Composio secrets not configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "1Password connection refreshed successfully." >> "$GITHUB_STEP_SUMMARY"
          fi
