name: Catalog health watchdog

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "public/index.html"
      - "public/data/zion-catalog.json"
      - "public/assets/js/zion-catalog.js"
      - ".github/workflows/catalog-health.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live homepage advertising + catalog JS
        run: |
          set -euo pipefail
          # Validate durable production contracts, not rotating marketing copy.
          html="$(for i in 1 2 3 4 5; do curl -fsSL -m 20 https://ziontechgroup.com/ || true; sleep 2; done)"
          discovery_html="$(for i in 1 2 3; do curl -fsSL -m 20 https://ziontechgroup.com/discovery/ || true; sleep 2; done)"
          fail=0

          must=(
            "Discovery"
            "App Network"
          )
          for s in "${must[@]}"; do
            if ! grep -Fq "$s" <<< "$html"; then
              echo "MISSING on homepage: $s"
              fail=1
            else
              echo "OK: $s"
            fi
          done

          if ! grep -Eiq 'gr[aá]tis|free' <<< "$discovery_html"; then
            echo "MISSING canonical free Discovery promise"
            fail=1
          else
            echo "OK: canonical free Discovery promise"
          fi

          js="$(for i in 1 2 3 4 5; do curl -fsSL -m 20 https://ziontechgroup.com/assets/js/zion-catalog.js || true; sleep 2; done)"
          js_must=(
            "Discovery"
            "Agentes Telegram"
            "Estimador FinOps"
            "ensureFinops"
            "finops-form"
          )
          for s in "${js_must[@]}"; do
            if ! grep -Fq "$s" <<< "$js"; then
              echo "MISSING in catalog JS: $s"
              fail=1
            else
              echo "OK JS: $s"
            fi
          done

          routes=(
            https://ziontechgroup.com/
            https://ziontechgroup.com/services/
            https://ziontechgroup.com/agents/
            https://ziontechgroup.com/plans/
            https://ziontechgroup.com/discovery/
            https://ziontechgroup.com/booking/
            https://ziontechgroup.com/cpa/
            https://ziontechgroup.com/free-ai-it-tools/
            https://ziontechgroup.com/academy/
            https://ziontechgroup.com/blog/
            https://ziontechgroup.com/telegram/
            https://ziontechgroup.com/pricing/
            https://ziontechgroup.com/finops-consulting/
            https://ziontechgroup.com/case-studies/
            https://ziontechgroup.com/assets/js/zion-catalog.js
          )
          for u in "${routes[@]}"; do
            code=$(curl -sI -o /dev/null -w "%{http_code}" "$u")
            echo "$code $u"
            case "$code" in
              200|301|302) ;;
              *) echo "BAD STATUS $code $u"; fail=1 ;;
            esac
          done

          if [ "$fail" -ne 0 ]; then
            echo "Watchdog found gaps."
            exit 1
          fi
          echo "Watchdog green."
